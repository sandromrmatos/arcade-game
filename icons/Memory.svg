<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cardGradient" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#4a5568;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="#1a202c"/>
  <!-- Card backs (face down) -->
  <rect x="10" y="15" width="18" height="25" fill="url(#cardGradient)" stroke="#4a5568" stroke-width="2" rx="3"/>
  <rect x="32" y="15" width="18" height="25" fill="url(#cardGradient)" stroke="#4a5568" stroke-width="2" rx="3"/>
  <rect x="54" y="15" width="18" height="25" fill="url(#cardGradient)" stroke="#4a5568" stroke-width="2" rx="3"/>
  <rect x="76" y="15" width="18" height="25" fill="url(#cardGradient)" stroke="#4a5568" stroke-width="2" rx="3"/>
  
  <!-- Card backs bottom row -->
  <rect x="10" y="45" width="18" height="25" fill="url(#cardGradient)" stroke="#4a5568" stroke-width="2" rx="3"/>
  <rect x="32" y="45" width="18" height="25" fill="url(#cardGradient)" stroke="#4a5568" stroke-width="2" rx="3"/>
  <rect x="54" y="45" width="18" height="25" fill="url(#cardGradient)" stroke="#4a5568" stroke-width="2" rx="3"/>
  <rect x="76" y="45" width="18" height="25" fill="url(#cardGradient)" stroke="#4a5568" stroke-width="2" rx="3"/>
  
  <!-- Pattern on card backs -->
  <circle cx="19" cy="27.5" r="4" fill="none" stroke="#718096" stroke-width="1.5"/>
  <circle cx="41" cy="27.5" r="4" fill="none" stroke="#718096" stroke-width="1.5"/>
  <circle cx="63" cy="27.5" r="4" fill="none" stroke="#718096" stroke-width="1.5"/>
  <circle cx="85" cy="27.5" r="4" fill="none" stroke="#718096" stroke-width="1.5"/>
  
  <!-- Face up cards showing symbols -->
  <rect x="10" y="75" width="18" height="25" fill="#f7fafc" stroke="#4a5568" stroke-width="2" rx="3"/>
  <text x="19" y="92" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#e53e3e">♥</text>
  
  <rect x="32" y="75" width="18" height="25" fill="#f7fafc" stroke="#4a5568" stroke-width="2" rx="3"/>
  <text x="41" y="92" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#3182ce">♦</text>
  
  <rect x="54" y="75" width="18" height="25" fill="#f7fafc" stroke="#4a5568" stroke-width="2" rx="3"/>
  <text x="63" y="92" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#38a169">★</text>
  
  <rect x="76" y="75" width="18" height="25" fill="#f7fafc" stroke="#4a5568" stroke-width="2" rx="3"/>
  <text x="85" y="92" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#d69e2e">✦</text>
</svg>
