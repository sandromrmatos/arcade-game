<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="hangmanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#hangmanGrad)" />
  
  <!-- Gallows -->
  <g stroke="white" stroke-width="3" fill="none">
    <!-- Base -->
    <line x1="20" y1="75" x2="55" y2="75" stroke-linecap="round"/>
    <!-- Vertical pole -->
    <line x1="35" y1="75" x2="35" y2="20" stroke-linecap="round"/>
    <!-- Horizontal beam -->
    <line x1="35" y1="20" x2="55" y2="20" stroke-linecap="round"/>
    <!-- Rope -->
    <line x1="55" y1="20" x2="55" y2="28" stroke-linecap="round"/>
  </g>
  
  <!-- Stick figure head (simplified) -->
  <circle cx="55" cy="35" r="7" stroke="white" stroke-width="2.5" fill="none"/>
  
  <!-- Body -->
  <line x1="55" y1="42" x2="55" y2="55" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Arms -->
  <line x1="55" y1="46" x2="48" y2="52" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="55" y1="46" x2="62" y2="52" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Legs -->
  <line x1="55" y1="55" x2="50" y2="64" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="55" y1="55" x2="60" y2="64" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
</svg>
