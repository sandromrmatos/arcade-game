<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Card 1 -->
  <rect x="15" y="20" width="30" height="45" rx="3" fill="url(#cardGrad)" stroke="#FFD700" stroke-width="2"/>
  <circle cx="30" cy="42.5" r="8" fill="#FFD700" opacity="0.8"/>
  
  <!-- Card 2 -->
  <rect x="35" y="30" width="30" height="45" rx="3" fill="url(#cardGrad)" stroke="#FFD700" stroke-width="2"/>
  <circle cx="50" cy="52.5" r="8" fill="#FFD700" opacity="0.8"/>
  
  <!-- Card 3 -->
  <rect x="55" y="25" width="30" height="45" rx="3" fill="url(#cardGrad)" stroke="#FFD700" stroke-width="2"/>
  <circle cx="70" cy="47.5" r="8" fill="#FFD700" opacity="0.8"/>
  
  <!-- Energy symbols on top card -->
  <circle cx="62" cy="32" r="3" fill="#FFD700"/>
  <circle cx="70" cy="32" r="3" fill="#FFD700"/>
  <circle cx="78" cy="32" r="3" fill="#FFD700"/>
</svg>
