<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#667eea"/>
  <!-- Maze pattern -->
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round">
    <!-- Outer border -->
    <rect x="10" y="10" width="80" height="80" stroke-width="6"/>
    <!-- Horizontal walls -->
    <line x1="10" y1="30" x2="40" y2="30"/>
    <line x1="60" y1="30" x2="90" y2="30"/>
    <line x1="30" y1="50" x2="70" y2="50"/>
    <line x1="10" y1="70" x2="40" y2="70"/>
    <line x1="60" y1="70" x2="90" y2="70"/>
    <!-- Vertical walls -->
    <line x1="30" y1="10" x2="30" y2="40"/>
    <line x1="30" y1="60" x2="30" y2="90"/>
    <line x1="50" y1="30" x2="50" y2="60"/>
    <line x1="70" y1="10" x2="70" y2="40"/>
    <line x1="70" y1="60" x2="70" y2="90"/>
  </g>
  <!-- Start marker -->
  <circle cx="18" cy="18" r="4" fill="#9effb0"/>
  <!-- Finish marker -->
  <circle cx="82" cy="82" r="4" fill="#f5576c"/>
</svg>
