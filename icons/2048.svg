  <!-- Tiles -->
  <rect x="15" y="15" width="17" height="17" fill="#eee4da" rx="2"/>
  <rect x="35" y="15" width="17" height="17" fill="#ede0c8" rx="2"/>
  <rect x="55" y="15" width="17" height="17" fill="#f2b179" rx="2"/>
  <rect x="75" y="15" width="17" height="17" fill="#f59563" rx="2"/>
  
  <rect x="15" y="35" width="17" height="17" fill="#f67c5f" rx="2"/>
