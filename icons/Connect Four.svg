<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" fill="#1565c0" rx="10"/>
  
  <!-- Grid holes -->
  <circle cx="20" cy="20" r="8" fill="#0d47a1"/>
  <circle cx="40" cy="20" r="8" fill="#0d47a1"/>
  <circle cx="60" cy="20" r="8" fill="#0d47a1"/>
  <circle cx="80" cy="20" r="8" fill="#0d47a1"/>
  
  <circle cx="20" cy="40" r="8" fill="#0d47a1"/>
  <circle cx="40" cy="40" r="8" fill="#0d47a1"/>
  <circle cx="60" cy="40" r="8" fill="#0d47a1"/>
  <circle cx="80" cy="40" r="8" fill="#0d47a1"/>
  
  <circle cx="20" cy="60" r="8" fill="#0d47a1"/>
  <circle cx="40" cy="60" r="8" fill="#0d47a1"/>
  <circle cx="60" cy="60" r="8" fill="#0d47a1"/>
  <circle cx="80" cy="60" r="8" fill="#0d47a1"/>
  
  <circle cx="20" cy="80" r="8" fill="#0d47a1"/>
  <circle cx="40" cy="80" r="8" fill="#0d47a1"/>
  <circle cx="60" cy="80" r="8" fill="#0d47a1"/>
  <circle cx="80" cy="80" r="8" fill="#0d47a1"/>
  
  <!-- Red pieces (diagonal win) -->
  <circle cx="20" cy="80" r="7" fill="#ff1744"/>
  <circle cx="40" cy="60" r="7" fill="#ff1744"/>
  <circle cx="60" cy="40" r="7" fill="#ff1744"/>
  <circle cx="80" cy="20" r="7" fill="#ff1744"/>
  
  <!-- Yellow pieces -->
  <circle cx="20" cy="60" r="7" fill="#ffeb3b"/>
  <circle cx="40" cy="80" r="7" fill="#ffeb3b"/>
  <circle cx="60" cy="80" r="7" fill="#ffeb3b"/>
</svg>
