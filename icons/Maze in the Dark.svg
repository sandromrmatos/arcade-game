<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" fill="url(#darkGrad)" rx="10"/>
  
  <!-- Dark maze structure -->
  <rect x="10" y="10" width="80" height="80" fill="#000" rx="5"/>
  
  <!-- Visible path sections (limited visibility effect) -->
  <rect x="15" y="15" width="10" height="30" fill="#0f3460"/>
  <rect x="15" y="35" width="30" height="10" fill="#0f3460"/>
  <rect x="35" y="45" width="10" height="20" fill="#0f3460"/>
  <rect x="45" y="55" width="20" height="10" fill="#0f3460"/>
  <rect x="55" y="35" width="10" height="20" fill="#0f3460"/>
  <rect x="65" y="35" width="20" height="10" fill="#0f3460"/>
  <rect x="75" y="45" width="10" height="40" fill="#0f3460"/>
  
  <!-- Player (paw) with glow -->
  <circle cx="20" cy="25" r="8" fill="#ffd700" opacity="0.3"/>
  <text x="20" y="30" font-size="14" text-anchor="middle" fill="#ffd700">🐾</text>
  
  <!-- Finish flag (always visible) with glow -->
  <circle cx="80" cy="80" r="8" fill="#e94560" opacity="0.3"/>
  <text x="80" y="85" font-size="14" text-anchor="middle" fill="#e94560">🏁</text>
  
  <!-- Flashlight beam effect -->
  <circle cx="20" cy="25" r="15" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.3"/>
  <circle cx="20" cy="25" r="20" fill="none" stroke="#ffd700" stroke-width="0.5" opacity="0.2"/>
</svg>
