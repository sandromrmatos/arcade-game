<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" fill="#764ba2" rx="10"/>
  
  <!-- Grid background -->
  <rect x="10" y="15" width="80" height="70" fill="#333" rx="5"/>
  
  <!-- Colored blocks arranged in collapsing pattern -->
  <!-- Top row - scattered -->
  <rect x="15" y="20" width="12" height="12" fill="#ff6b6b" rx="2"/>
  <rect x="29" y="20" width="12" height="12" fill="#4ecdc4" rx="2"/>
  <rect x="43" y="20" width="12" height="12" fill="#ffe66d" rx="2"/>
  <rect x="71" y="20" width="12" height="12" fill="#95e1d3" rx="2"/>
  
  <!-- Second row -->
  <rect x="15" y="34" width="12" height="12" fill="#4ecdc4" rx="2"/>
  <rect x="29" y="34" width="12" height="12" fill="#ffe66d" rx="2"/>
  <rect x="57" y="34" width="12" height="12" fill="#ff6b6b" rx="2"/>
  <rect x="71" y="34" width="12" height="12" fill="#a8e6cf" rx="2"/>
  
  <!-- Third row - more grouped -->
  <rect x="15" y="48" width="12" height="12" fill="#ffe66d" rx="2"/>
  <rect x="29" y="48" width="12" height="12" fill="#ffe66d" rx="2"/>
  <rect x="43" y="48" width="12" height="12" fill="#4ecdc4" rx="2"/>
  <rect x="57" y="48" width="12" height="12" fill="#95e1d3" rx="2"/>
  <rect x="71" y="48" width="12" height="12" fill="#95e1d3" rx="2"/>
  
  <!-- Fourth row - densely packed -->
  <rect x="15" y="62" width="12" height="12" fill="#ff6b6b" rx="2"/>
  <rect x="29" y="62" width="12" height="12" fill="#ff6b6b" rx="2"/>
  <rect x="43" y="62" width="12" height="12" fill="#ff6b6b" rx="2"/>
  <rect x="57" y="62" width="12" height="12" fill="#4ecdc4" rx="2"/>
  <rect x="71" y="62" width="12" height="12" fill="#4ecdc4" rx="2"/>
  
  <!-- Bottom row - full -->
  <rect x="15" y="76" width="12" height="12" fill="#a8e6cf" rx="2"/>
  <rect x="29" y="76" width="12" height="12" fill="#95e1d3" rx="2"/>
  <rect x="43" y="76" width="12" height="12" fill="#ffe66d" rx="2"/>
  <rect x="57" y="76" width="12" height="12" fill="#ffe66d" rx="2"/>
  <rect x="71" y="76" width="12" height="12" fill="#a8e6cf" rx="2"/>
  
  <!-- Down arrow indicating collapse -->
  <path d="M 45 10 L 45 5 L 55 5 L 55 10 L 60 10 L 50 18 L 40 10 Z" fill="white" opacity="0.9"/>
</svg>
