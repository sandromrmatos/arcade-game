<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#fff"/>
  <!-- Grid -->
  <rect x="10" y="10" width="80" height="80" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <!-- Grid lines -->
  <line x1="22" y1="10" x2="22" y2="90" stroke="#dee2e6" stroke-width="0.5"/>
  <line x1="34" y1="10" x2="34" y2="90" stroke="#dee2e6" stroke-width="0.5"/>
  <line x1="46" y1="10" x2="46" y2="90" stroke="#dee2e6" stroke-width="0.5"/>
  <line x1="58" y1="10" x2="58" y2="90" stroke="#dee2e6" stroke-width="0.5"/>
  <line x1="70" y1="10" x2="70" y2="90" stroke="#dee2e6" stroke-width="0.5"/>
  <line x1="82" y1="10" x2="82" y2="90" stroke="#dee2e6" stroke-width="0.5"/>
  <line x1="10" y1="22" x2="90" y2="22" stroke="#dee2e6" stroke-width="0.5"/>
  <line x1="10" y1="34" x2="90" y2="34" stroke="#dee2e6" stroke-width="0.5"/>
  <line x1="10" y1="46" x2="90" y2="46" stroke="#dee2e6" stroke-width="0.5"/>
  <line x1="10" y1="58" x2="90" y2="58" stroke="#dee2e6" stroke-width="0.5"/>
  <line x1="10" y1="70" x2="90" y2="70" stroke="#dee2e6" stroke-width="0.5"/>
  <line x1="10" y1="82" x2="90" y2="82" stroke="#dee2e6" stroke-width="0.5"/>
  <!-- Letters -->
  <text x="14" y="20" font-family="Arial, sans-serif" font-size="8" fill="#495057">G</text>
  <text x="26" y="20" font-family="Arial, sans-serif" font-size="8" fill="#495057">A</text>
  <text x="38" y="20" font-family="Arial, sans-serif" font-size="8" fill="#495057">M</text>
  <text x="50" y="20" font-family="Arial, sans-serif" font-size="8" fill="#495057">E</text>
  <text x="62" y="20" font-family="Arial, sans-serif" font-size="8" fill="#495057">S</text>
  <!-- Highlighted word -->
  <rect x="11" y="12" width="48" height="10" fill="#ffc107" opacity="0.4" rx="2"/>
  <text x="14" y="20" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#000">G</text>
  <text x="26" y="20" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#000">A</text>
  <text x="38" y="20" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#000">M</text>
  <text x="50" y="20" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#000">E</text>
  <!-- More letters -->
  <text x="14" y="32" font-family="Arial, sans-serif" font-size="8" fill="#495057">P</text>
  <text x="26" y="32" font-family="Arial, sans-serif" font-size="8" fill="#495057">U</text>
  <text x="38" y="32" font-family="Arial, sans-serif" font-size="8" fill="#495057">Z</text>
  <text x="50" y="32" font-family="Arial, sans-serif" font-size="8" fill="#495057">L</text>
  <text x="62" y="32" font-family="Arial, sans-serif" font-size="8" fill="#495057">E</text>
</svg>
