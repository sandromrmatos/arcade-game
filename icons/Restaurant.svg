<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="restaurantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a6f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#restaurantGrad)" />
  
  <!-- Fork (left) -->
  <g fill="white">
    <rect x="28" y="30" width="3" height="45" rx="1.5" />
    <rect x="24" y="30" width="2" height="20" rx="1" />
    <rect x="32" y="30" width="2" height="20" rx="1" />
    <rect x="28" y="30" width="2" height="20" rx="1" />
  </g>
  
  <!-- Knife (right) -->
  <g fill="white">
    <rect x="66" y="30" width="4" height="45" rx="2" />
    <path d="M 66 30 L 70 30 L 73 25 L 70 20 L 66 20 Z" />
  </g>
  
  <!-- Plate (center bottom) -->
  <ellipse cx="50" cy="65" rx="20" ry="6" fill="white" opacity="0.9" />
  
  <!-- Chef hat on top -->
  <g fill="white">
    <rect x="45" y="15" width="10" height="3" rx="1.5" />
    <path d="M 43 15 Q 43 8 50 8 Q 57 8 57 15 Z" />
  </g>
</svg>
