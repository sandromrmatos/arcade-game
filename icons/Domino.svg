<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#2a5a2a"/>
  <!-- Domino pieces -->
  <!-- First domino (vertical) -->
  <rect x="15" y="20" width="25" height="60" fill="#f5f5dc" stroke="#000" stroke-width="2" rx="3"/>
  <line x1="15" y1="50" x2="40" y2="50" stroke="#000" stroke-width="1.5"/>
  <!-- Top dots (3) -->
  <circle cx="20" cy="30" r="2.5" fill="#000"/>
  <circle cx="27.5" cy="35" r="2.5" fill="#000"/>
  <circle cx="35" cy="40" r="2.5" fill="#000"/>
  <!-- Bottom dots (5) -->
  <circle cx="20" cy="60" r="2.5" fill="#000"/>
  <circle cx="20" cy="70" r="2.5" fill="#000"/>
  <circle cx="27.5" cy="65" r="2.5" fill="#000"/>
  <circle cx="35" cy="60" r="2.5" fill="#000"/>
  <circle cx="35" cy="70" r="2.5" fill="#000"/>
  
  <!-- Second domino (horizontal) -->
  <rect x="50" y="35" width="40" height="20" fill="#fff" stroke="#000" stroke-width="2" rx="2"/>
  <line x1="70" y1="35" x2="70" y2="55" stroke="#000" stroke-width="1.5"/>
  <!-- Left dots (4) -->
  <circle cx="55" cy="40" r="2" fill="#000"/>
  <circle cx="55" cy="50" r="2" fill="#000"/>
  <circle cx="65" cy="40" r="2" fill="#000"/>
  <circle cx="65" cy="50" r="2" fill="#000"/>
  <!-- Right dots (2) -->
  <circle cx="75" cy="41" r="2" fill="#000"/>
  <circle cx="85" cy="49" r="2" fill="#000"/>
  
  <!-- Third domino (vertical, bottom) -->
  <rect x="60" y="60" width="20" height="30" fill="#f5f5dc" stroke="#000" stroke-width="2" rx="2"/>
  <line x1="60" y1="75" x2="80" y2="75" stroke="#000" stroke-width="1.5"/>
  <!-- Top (1) -->
  <circle cx="70" cy="67" r="2.5" fill="#000"/>
  <!-- Bottom (6) -->
  <circle cx="63" cy="80" r="2" fill="#000"/>
  <circle cx="63" cy="85" r="2" fill="#000"/>
  <circle cx="70" cy="82.5" r="2" fill="#000"/>
  <circle cx="77" cy="80" r="2" fill="#000"/>
  <circle cx="77" cy="85" r="2" fill="#000"/>
</svg>
