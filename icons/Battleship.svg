<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Ocean background -->
  <rect x="0" y="0" width="200" height="200" fill="#1e3c72"/>
  
  <!-- Waves -->
  <path d="M0,140 Q25,130 50,140 T100,140 T150,140 T200,140 L200,200 L0,200 Z" fill="#2a5298" opacity="0.6"/>
  <path d="M0,160 Q25,150 50,160 T100,160 T150,160 T200,160 L200,200 L0,200 Z" fill="#3d6bb3" opacity="0.5"/>
  
  <!-- Grid representation (bottom) -->
  <rect x="40" y="120" width="120" height="70" fill="#87CEEB" opacity="0.3" rx="4"/>
  
  <!-- Grid lines -->
  <line x1="55" y1="120" x2="55" y2="190" stroke="#4682B4" stroke-width="1" opacity="0.5"/>
  <line x1="70" y1="120" x2="70" y2="190" stroke="#4682B4" stroke-width="1" opacity="0.5"/>
  <line x1="85" y1="120" x2="85" y2="190" stroke="#4682B4" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="120" x2="100" y2="190" stroke="#4682B4" stroke-width="1" opacity="0.5"/>
  <line x1="115" y1="120" x2="115" y2="190" stroke="#4682B4" stroke-width="1" opacity="0.5"/>
  <line x1="130" y1="120" x2="130" y2="190" stroke="#4682B4" stroke-width="1" opacity="0.5"/>
  <line x1="145" y1="120" x2="145" y2="190" stroke="#4682B4" stroke-width="1" opacity="0.5"/>
  
  <line x1="40" y1="135" x2="160" y2="135" stroke="#4682B4" stroke-width="1" opacity="0.5"/>
  <line x1="40" y1="150" x2="160" y2="150" stroke="#4682B4" stroke-width="1" opacity="0.5"/>
  <line x1="40" y1="165" x2="160" y2="165" stroke="#4682B4" stroke-width="1" opacity="0.5"/>
  
  <!-- Hit markers on grid -->
  <circle cx="62.5" cy="142.5" r="5" fill="#ff4444"/>
  <circle cx="107.5" cy="157.5" r="5" fill="#ff4444"/>
  <circle cx="77.5" cy="172.5" r="4" fill="#ddd"/>
  
  <!-- Main battleship -->
  <g transform="translate(100, 60)">
    <!-- Ship hull -->
    <ellipse cx="0" cy="0" rx="60" ry="18" fill="#708090"/>
    <ellipse cx="0" cy="-2" rx="60" ry="16" fill="#778899"/>
    
    <!-- Deck -->
    <rect x="-50" y="-8" width="100" height="12" fill="#556B7D" rx="2"/>
    
    <!-- Bridge/Command center -->
    <rect x="-15" y="-25" width="30" height="17" fill="#4A5F73" rx="2"/>
    <rect x="-12" y="-27" width="24" height="3" fill="#3A4F63"/>
    
    <!-- Windows -->
    <rect x="-8" y="-22" width="4" height="5" fill="#87CEEB" opacity="0.8"/>
    <rect x="4" y="-22" width="4" height="5" fill="#87CEEB" opacity="0.8"/>
    
    <!-- Smokestack -->
    <rect x="-25" y="-22" width="8" height="14" fill="#5A6F83" rx="1"/>
    <rect x="-24" y="-24" width="6" height="2" fill="#4A5F73"/>
    
    <!-- Cannon turrets -->
    <circle cx="-35" cy="-5" r="8" fill="#4A5F73"/>
    <rect x="-40" y="-7" width="10" height="4" fill="#3A4F63" rx="1"/>
    
    <circle cx="35" cy="-5" r="8" fill="#4A5F73"/>
    <rect x="30" y="-7" width="10" height="4" fill="#3A4F63" rx="1"/>
    
    <!-- Radar/antenna -->
    <line x1="0" y1="-27" x2="0" y2="-35" stroke="#3A4F63" stroke-width="1.5"/>
    <circle cx="0" cy="-37" r="3" fill="#FF6B6B"/>
    
    <!-- Details/rivets -->
    <circle cx="-45" cy="-2" r="1.5" fill="#4A5F73" opacity="0.5"/>
    <circle cx="-35" cy="-2" r="1.5" fill="#4A5F73" opacity="0.5"/>
    <circle cx="35" cy="-2" r="1.5" fill="#4A5F73" opacity="0.5"/>
    <circle cx="45" cy="-2" r="1.5" fill="#4A5F73" opacity="0.5"/>
  </g>
  
  <!-- Water splash effects -->
  <circle cx="30" cy="85" r="3" fill="#fff" opacity="0.4"/>
  <circle cx="170" cy="75" r="4" fill="#fff" opacity="0.3"/>
  <circle cx="35" cy="95" r="2" fill="#fff" opacity="0.5"/>
</svg>
