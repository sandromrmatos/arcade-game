<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)" stroke="#fff" stroke-width="2"/>
  
  <!-- Grid of tiles (3x3 arrangement) -->
  <rect x="15" y="15" width="18" height="18" rx="3" fill="url(#grad2)" opacity="0.8"/>
  <rect x="41" y="15" width="18" height="18" rx="3" fill="url(#grad2)" opacity="0.8"/>
  <rect x="67" y="15" width="18" height="18" rx="3" fill="url(#grad2)" opacity="0.8"/>
  
  <rect x="15" y="41" width="18" height="18" rx="3" fill="url(#grad2)" opacity="0.8"/>
  <rect x="41" y="41" width="18" height="18" rx="3" fill="url(#grad2)" opacity="0.8"/>
  <rect x="67" y="41" width="18" height="18" rx="3" fill="url(#grad2)" opacity="0.8"/>
  
  <rect x="15" y="67" width="18" height="18" rx="3" fill="url(#grad2)" opacity="0.8"/>
  <rect x="41" y="67" width="18" height="18" rx="3" fill="url(#grad2)" opacity="0.8"/>
  <rect x="67" y="67" width="18" height="18" rx="3" fill="url(#grad2)" opacity="0.8"/>
  
  <!-- Numbers on some tiles -->
  <text x="24" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <text x="50" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <text x="76" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  
  <text x="24" y="54" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
  <text x="50" y="54" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
  <text x="76" y="54" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
  
  <text x="24" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">7</text>
  <text x="50" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">8</text>
  <text x="76" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">9</text>
</svg>
