<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" fill="#87CEEB" rx="10"/>
  
  <!-- Ground -->
  <rect x="0" y="60" width="100" height="40" fill="#8B7355"/>
  <rect x="0" y="60" width="100" height="5" fill="#6B5D50"/>
  
  <!-- Farm plot (dark soil) -->
  <rect x="15" y="65" width="30" height="30" fill="#4A3F35" rx="2"/>
  <rect x="55" y="65" width="30" height="30" fill="#4A3F35" rx="2"/>
  
  <!-- Wheat crops on left plot -->
  <text x="20" y="82" font-size="18" fill="#F4E04D">🌾</text>
  <text x="30" y="82" font-size="18" fill="#F4E04D">🌾</text>
  <text x="25" y="91" font-size="18" fill="#F4E04D">🌾</text>
  
  <!-- Tomato crops on right plot -->
  <text x="60" y="82" font-size="18" fill="#FF6347">🍅</text>
  <text x="70" y="82" font-size="18" fill="#FF6347">🍅</text>
  <text x="65" y="91" font-size="18" fill="#FF6347">🍅</text>
  
  <!-- Barn/Building -->
  <rect x="30" y="35" width="40" height="30" fill="#8B4513" rx="2"/>
  <rect x="35" y="40" width="30" height="25" fill="#A0522D"/>
  <polygon points="50,25 30,40 70,40" fill="#8B0000"/>
  
  <!-- Barn door -->
  <rect x="43" y="48" width="14" height="17" fill="#654321" rx="1"/>
  
  <!-- Window -->
  <circle cx="42" cy="45" r="3" fill="#FFE4B5"/>
  <circle cx="58" cy="45" r="3" fill="#FFE4B5"/>
  
  <!-- Sun -->
  <circle cx="80" cy="20" r="8" fill="#FFD700"/>
  <circle cx="80" cy="20" r="6" fill="#FFA500"/>
  
  <!-- Clouds -->
  <ellipse cx="25" cy="15" rx="8" ry="5" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="20" cy="17" rx="6" ry="4" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="30" cy="17" rx="6" ry="4" fill="#FFFFFF" opacity="0.8"/>
  
  <!-- Coin icon (bottom right) -->
  <circle cx="88" cy="88" r="10" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
  <text x="88" y="93" font-size="14" fill="#FFA500" text-anchor="middle" font-weight="bold">🪙</text>
</svg>
