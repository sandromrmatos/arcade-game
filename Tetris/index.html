<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tetris</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f0f0f0;
    }
    #container {
        display: flex;
        justify-content: center;
        margin-top: 20px;
    }
    #leftPanel {
        margin-right: 20px;
    }
    #score {
        font-size: 20px;
        margin-bottom: 10px;
    }
    #message {
        margin-top: 10px;
        font-size: 16px;
        color: #e33;
        height: 22px;
    }
    canvas {
        background: #222;
        border: 3px solid #555;
        display: block;
    }
    #nextLabel {
        font-size: 18px;
        margin-bottom: 5px;
    }
</style>
</head>
<body>

<h2>Tetris</h2>

<div id="container">
    <div id="leftPanel">
        <div id="score">Score: 0</div>
        <canvas id="tetris" width="200" height="400"></canvas>
        <div id="message"></div>
    </div>

    <div id="rightPanel">
        <div id="nextLabel">Next:</div>
        <canvas id="nextPiece" width="80" height="80"></canvas>
    </div>
</div>

<script>
const canvas = document.getElementById("tetris");
const ctx = canvas.getContext("2d");

const nextCanvas = document.getElementById("nextPiece");
const nextCtx = nextCanvas.getContext("2d");

const COLS = 10;
const ROWS = 20;
const BLOCK = 20;

let board = createMatrix(COLS, ROWS);
let score = 0;
let gameOver = false;

let dropInterval = 500; // starting speed (ms)
let dropCounter = 0;
let lastTime = 0;

const colors = [
    null,
    "#FF0D72", // T
    "#0DC2FF", // I
    "#0DFF72", // S
    "#F538FF", // Z
    "#FF8E0D", // L
    "#FFE138", // O
    "#3877FF"  // J
];

const pieces = "TISZLOJ";

function createMatrix(w, h) {
    const matrix = [];
    for (let y = 0; y < h; y++) {
        matrix.push(new Array(w).fill(0));
    }
    return matrix;
}

function createPiece(type) {
    if (type === "T") {
        return [
            [0, 0, 0],
            [1, 1, 1],
            [0, 1, 0]
        ];
    } else if (type === "I") {
        return [
            [0, 2, 0, 0],
            [0, 2, 0, 0],
            [0, 2, 0, 0],
            [0, 2, 0, 0]
        ];
    } else if (type === "S") {
        return [
            [0, 3, 3],
            [3, 3, 0],
            [0, 0, 0]
        ];
    } else if (type === "Z") {
        return [
            [4, 4, 0],
            [0, 4, 4],
            [0, 0, 0]
        ];
    } else if (type === "L") {
        return [
            [0, 5, 0],
            [0, 5, 0],
            [0, 5, 5]
        ];
    } else if (type === "O") {
        return [
            [6, 6],
            [6, 6]
        ];
    } else if (type === "J") {
        return [
            [0, 7, 0],
            [0, 7, 0],
            [7, 7, 0]
        ];
    }
}

let nextPieceType = pieces[(Math.random() * pieces.length) | 0];

let player = {
    pos: { x: 0, y: 0 },
    matrix: createPiece(nextPieceType)
};

function drawNextPiece() {
    nextCtx.fillStyle = "#222";
    nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

    const matrix = createPiece(nextPieceType);

    matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                nextCtx.fillStyle = colors[value];
                nextCtx.fillRect(x * 20, y * 20, 20, 20);
            }
        });
    });
}

function playerReset() {
    player.matrix = createPiece(nextPieceType);
    nextPieceType = pieces[(Math.random() * pieces.length) | 0];
    drawNextPiece();

    player.pos.y = 0;
    player.pos.x = (COLS / 2 | 0) - (player.matrix[0].length / 2 | 0);

    if (collide(board, player)) {
        gameOver = true;
        document.getElementById("message").textContent = "Game Over!";
    }
}

function collide(board, player) {
    const m = player.matrix;
    const o = player.pos;
    for (let y = 0; y < m.length; y++) {
        for (let x = 0; x < m[y].length; x++) {
            if (m[y][x] !== 0 &&
                (board[y + o.y] && board[y + o.y][x + o.x]) !== 0) {
                return true;
            }
        }
    }
    return false;
}

function merge(board, player) {
    player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                board[y + player.pos.y][x + player.pos.x] = value;
            }
        });
    });
}

function rotate(matrix, dir) {
    for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < y; x++) {
            [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
    }
    if (dir > 0) {
        matrix.forEach(row => row.reverse());
    } else {
        matrix.reverse();
    }
}

function playerRotate(dir) {
    const pos = player.pos.x;
    let offset = 1;
    rotate(player.matrix, dir);
    while (collide(board, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
            rotate(player.matrix, -dir);
            player.pos.x = pos;
            return;
        }
    }
}

function sweep() {
    for (let y = board.length - 1; y >= 0; y--) {
        if (board[y].every(v => v !== 0)) {
            board.splice(y, 1);
            board.unshift(new Array(COLS).fill(0));

            score += 1; // 1 point per row
            dropInterval = Math.max(100, dropInterval - 20); // speed up

            document.getElementById("score").textContent = "Score: " + score;
            y++;
        }
    }
}

function drawMatrix(matrix, offset) {
    matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                ctx.fillStyle = colors[value];
                ctx.fillRect(
                    (x + offset.x) * BLOCK,
                    (y + offset.y) * BLOCK,
                    BLOCK,
                    BLOCK
                );
            }
        });
    });
}

function draw() {
    ctx.fillStyle = "#222";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawMatrix(board, { x: 0, y: 0 });
    drawMatrix(player.matrix, player.pos);
}

function update(time = 0) {
    if (gameOver) {
        draw();
        return;
    }

    const delta = time - lastTime;
    lastTime = time;
    dropCounter += delta;

    if (dropCounter > dropInterval) {
        playerDrop();
    }

    draw();
    requestAnimationFrame(update);
}

function playerDrop() {
    player.pos.y++;
    if (collide(board, player)) {
        player.pos.y--;
        merge(board, player);
        sweep();
        playerReset();
    }
    dropCounter = 0;
}

function playerMove(dir) {
    player.pos.x += dir;
    if (collide(board, player)) {
        player.pos.x -= dir;
    }
}

document.addEventListener("keydown", e => {
    if (gameOver) return;

    if (e.key === "ArrowLeft") playerMove(-1);
    else if (e.key === "ArrowRight") playerMove(1);
    else if (e.key === "ArrowDown") playerDrop();
    else if (e.key === "ArrowUp") playerRotate(1);
    else if (e.key === " ") {
        while (!collide(board, player)) {
            player.pos.y++;
        }
        player.pos.y--;
        merge(board, player);
        sweep();
        playerReset();
        dropCounter = 0;
    }
});

drawNextPiece();
playerReset();
update();
</script>

</body>
</html>
