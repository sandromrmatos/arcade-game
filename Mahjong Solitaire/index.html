<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mahjong Solitaire</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="mahjong-wrapper">
    <header class="mahjong-header">
      <h1>Mahjong Solitaire</h1>
      <div class="mahjong-info">
        <div>Timer: <span id="timer">00:00</span></div>
        <button id="restartButton">Restart</button>
      </div>
      <div id="finishMessage" class="finish-message"></div>
    </header>

    <main class="mahjong-main">
      <div id="board" class="mahjong-board"></div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
