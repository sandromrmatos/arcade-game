<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tic Tac Toe</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f0f0f0;
        margin: 0;
        padding: 20px;
    }
    
    .container {
        max-width: 600px;
        margin: 0 auto;
    }
    
    /* Mode Selection */
    #mode-selection {
        margin: 20px 0;
    }
    
    .mode-btn {
        padding: 15px 30px;
        font-size: 18px;
        margin: 10px;
        cursor: pointer;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 8px;
        transition: background 0.3s;
    }
    
    .mode-btn:hover {
        background: #45a049;
    }
    
    .mode-btn.multiplayer {
        background: #2196F3;
    }
    
    .mode-btn.multiplayer:hover {
        background: #0b7dda;
    }
    
    /* Multiplayer Lobby */
    #multiplayer-lobby {
        display: none;
        margin: 20px 0;
    }
    
    #room-input {
        padding: 10px;
        font-size: 16px;
        width: 200px;
        margin: 10px;
        border: 2px solid #ddd;
        border-radius: 4px;
    }
    
    .lobby-btn {
        padding: 10px 20px;
        font-size: 16px;
        margin: 5px;
        cursor: pointer;
        background: #2196F3;
        color: white;
        border: none;
        border-radius: 5px;
    }
    
    .lobby-btn:hover {
        background: #0b7dda;
    }
    
    .lobby-btn.ready {
        background: #4CAF50;
    }
    
    .lobby-btn.ready:hover {
        background: #45a049;
    }
    
    .lobby-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
    }
    
    #lobby-status {
        margin: 20px 0;
        font-size: 18px;
        min-height: 60px;
    }
    
    .player-info {
        background: #fff;
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
        border: 2px solid #ddd;
    }
    
    .player-info.ready {
        border-color: #4CAF50;
        background: #e8f5e9;
    }
    
    /* Game Board */
    #game-container {
        display: none;
    }
    
    #board {
        display: grid;
        grid-template-columns: repeat(3, 100px);
        grid-gap: 5px;
        justify-content: center;
        margin-top: 20px;
    }
    
    .cell {
        width: 100px;
        height: 100px;
        background: #ddd;
        border: 2px solid #999;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 50px;
        cursor: pointer;
        user-select: none;
    }
    
    .cell.disabled {
        pointer-events: none;
        background: #eee;
    }
    
    #message {
        margin-top: 20px;
        font-size: 22px;
        min-height: 30px;
    }
    
    #turn-indicator {
        margin-top: 10px;
        font-size: 18px;
        color: #666;
        min-height: 25px;
    }
    
    button.action-btn {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 18px;
        cursor: pointer;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
    }
    
    button.action-btn:hover {
        background: #45a049;
    }
    
    .hidden {
        display: none;
    }
</style>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <h2>Tic Tac Toe</h2>

    <!-- Mode Selection -->
    <div id="mode-selection">
        <h3>Choose Game Mode</h3>
        <button class="mode-btn" onclick="startSinglePlayer()">Single Player</button>
        <button class="mode-btn multiplayer" onclick="showMultiplayerLobby()">Multiplayer</button>
    </div>

    <!-- Multiplayer Lobby -->
    <div id="multiplayer-lobby">
        <h3>Multiplayer Lobby</h3>
        <div>
            <input type="text" id="room-input" placeholder="Enter room code" maxlength="10">
            <br>
            <button class="lobby-btn" onclick="createRoom()">Create Room</button>
            <button class="lobby-btn" onclick="joinRoom()">Join Room</button>
            <button class="lobby-btn" onclick="backToModeSelection()">Back</button>
        </div>
        <div id="lobby-status"></div>
        <button id="ready-btn" class="lobby-btn ready hidden" onclick="toggleReady()">Ready</button>
    </div>

    <!-- Game Container -->
    <div id="game-container">
        <div id="board"></div>
        <p id="message"></p>
        <p id="turn-indicator"></p>
        <button class="action-btn" onclick="resetGame()">New Game</button>
        <button class="action-btn" onclick="backToModeSelection()">Back to Menu</button>
    </div>
</div>

<script src="game.js"></script>

</body>
</html>
