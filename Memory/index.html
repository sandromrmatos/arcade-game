<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Memory Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-wrapper">
    <h1>Memory Game</h1>

    <div id="menuOverlay" class="menu-overlay">
      <div class="menu-content">
        <h2>Memory Game</h2>
        <p>Select Size:</p>
        <button id="btnSmall" class="menu-btn">Small (4x4 - 8 pairs)</button>
        <button id="btnLarge" class="menu-btn">Large (6x6 - 18 pairs)</button>
      </div>
    </div>

    <div class="stats">
      <div class="turns">Turns: <span id="turnCount">0</span></div>
      <button id="resetButton">Reset Game</button>
    </div>

    <div id="message" class="message"></div>

    <div id="gameBoard" class="game-board">
      <!-- Cards will be injected by script.js -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
