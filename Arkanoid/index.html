<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arkanoid Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="arkanoid-wrapper">
    <header class="arkanoid-header">
      <h1>Arkanoid</h1>

      <div class="controls">
        <label for="difficulty" id="difficultyLabel">Difficulty:</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="hard">Hard</option>
        </select>
        <button id="startButton">Start</button>
        <button id="resetButton">Reset</button>
      </div>

      <div class="hud">
        <div class="hud-left">
          <span id="scoreLabel">Score:</span> <span id="score">0</span>
          <span id="livesLabel">Lives:</span> <span id="lives">3</span>
        </div>
        <div id="statusMessage"></div>
      </div>
    </header>

    <div class="game-area-wrapper">
      <div id="gameArea">
        <div id="bricksContainer"></div>
        <div id="paddle"></div>
      </div>

      <!-- Mobile controls -->
      <div class="mobile-controls">
        <button id="leftArrow" class="arrow-btn">◀</button>
        <button id="rightArrow" class="arrow-btn">▶</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
