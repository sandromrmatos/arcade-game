<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arcade Games by Sandro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="banner">
    <h1>Arcade Games by Sandro</h1>

    <div id="menu" class="menu"></div>

    <button id="music-btn" class="music-btn">▶️</button>
    <button id="keyboard-toggle" class="keyboard-btn">⌨️</button>
  </div>

  <div class="game-area">
    <iframe id="game-frame" src="home.html"></iframe>
  </div>

  <!-- Tiny visible input to trigger mobile keyboard -->
  <input id="mobile-keyboard-input"
         autocomplete="off"
         autocorrect="off"
         autocapitalize="off"
         spellcheck="false"
         placeholder="Mobile controls active">

  <script src="script.js"></script>
</body>
</html>
