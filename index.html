<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arcade Games by Sandro</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <div class="banner">
    <h1>Arcade Games by Sandro</h1>

    <div id="menu" class="menu"></div>

    <div class="controls-row">
      <div class="music-controls">
        <button id="music-prev" class="control-btn" title="Previous">⏮</button>
        <button id="music-play" class="control-btn" title="Play/Pause">▶️</button>
        <button id="music-next" class="control-btn" title="Next">⏭</button>
        <span id="music-track-name" class="track-name">No track playing</span>
      </div>
      
      <div class="right-controls">
        <select id="language-select" class="language-select">
          <option value="en">EN</option>
          <option value="pt">PT</option>
        </select>
        
        <button id="collapse-btn" class="collapse-btn" title="Collapse menu">▲</button>
      </div>
    </div>
  </div>

  <div id="leaderboard-section" class="leaderboard-section hidden">
    <div class="leaderboard-content">
      <button class="close-leaderboard-btn">×</button>
      <h2>Game Leaderboards</h2>
      <p>Select a game to view its high scores:</p>
      <div id="leaderboard-game-list" class="leaderboard-game-list"></div>
    </div>
  </div>

  <div class="game-area">
    <iframe id="game-frame" src="home.html"></iframe>
  </div>

  <!-- Name Input Modal -->
  <div id="name-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Welcome!</h2>
      <p>Please enter your name:</p>
      <input type="text" id="player-name-input" placeholder="Your name" maxlength="20">
      <button id="save-name-btn">Start Playing</button>
    </div>
  </div>

  <!-- Social Bar -->
  <script src="script.js"></script>
</body>
</html>
