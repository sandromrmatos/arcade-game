<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arcade Games by Sandro</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <div class="banner">
    <h1>Arcade Games by Sandro</h1>

    <div id="menu" class="menu"></div>

    <button id="music-btn" class="music-btn">▶️</button>
    <button id="keyboard-toggle" class="keyboard-btn">⌨️</button>
  </div>

  <div id="leaderboard-section" class="leaderboard-section hidden">
    <div class="leaderboard-content">
      <button class="close-leaderboard-btn">×</button>
      <h2>Game Leaderboards</h2>
      <p>Select a game to view its high scores:</p>
      <div id="leaderboard-game-list" class="leaderboard-game-list"></div>
    </div>
  </div>

  <div class="game-area">
    <iframe id="game-frame" src="home.html"></iframe>
  </div>

  <!-- Tiny visible input to trigger mobile keyboard -->
  <input id="mobile-keyboard-input"
         autocomplete="off"
         autocorrect="off"
         autocapitalize="off"
         spellcheck="false"
         placeholder="Mobile controls active">

  <!-- Name Input Modal -->
  <div id="name-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Welcome!</h2>
      <p>Please enter your name:</p>
      <input type="text" id="player-name-input" placeholder="Your name" maxlength="20">
      <button id="save-name-btn">Start Playing</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
