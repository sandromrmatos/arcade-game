<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arcade Games by Sandro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Persistent Banner -->
  <div class="banner">
    <h1>Arcade Games by Sandro</h1>

    <div id="menu" class="menu"></div>

    <!-- Music Button -->
    <button id="music-btn" class="music-btn">▶️</button>

    <!-- Keyboard Toggle Button -->
    <button id="keyboard-toggle" class="keyboard-btn">⌨️</button>
  </div>

  <!-- Game Area -->
  <div class="game-area">
    <iframe id="game-frame" src="home.html"></iframe>
  </div>

  <!-- Mobile Controls Overlay -->
  <div id="mobile-controls">
    <button data-dir="up">▲</button>
    <div class="row">
      <button data-dir="left">◀</button>
      <button data-dir="rotate">⟳</button>
      <button data-dir="right">▶</button>
    </div>
    <button data-dir="down">▼</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
