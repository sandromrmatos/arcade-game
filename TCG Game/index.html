<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elemental Awakening TCG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Deck Selection Screen -->
        <div id="deck-selection" class="deck-selection">
            <h1>Choose Your Deck</h1>
            <div id="deck-list" class="deck-list"></div>
        </div>

        <!-- Game Screen (hidden initially) -->
        <div id="game-screen" style="display: none;">
        <div id="game-info">
            <div class="player-info">
                <h3>Opponent</h3>
                <div class="stats">
                    <span>Points: <span id="opponent-points">0</span>/3</span>
                    <span>Deck: <span id="opponent-deck-count">20</span></span>
                </div>
            </div>
            <div class="turn-info">
                <h2 id="turn-indicator">Setting up...</h2>
                <div id="turn-counter">Turn: <span id="turn-number">0</span>/30</div>
            </div>
            <div class="player-info">
                <h3>You</h3>
                <div class="stats">
                    <span>Points: <span id="player-points">0</span>/3</span>
                    <span>Deck: <span id="player-deck-count">20</span></span>
                </div>
            </div>
        </div>

        <!-- Opponent's Board -->
        <div class="board opponent-board">
            <div class="hand-area">
                <div id="opponent-hand" class="hand">
                    <!-- Opponent's hand (face down) -->
                </div>
            </div>
            <div class="play-area">
                <div class="bench-area">
                    <div class="card-slot bench-slot" data-player="opponent" data-slot="0"></div>
                    <div class="card-slot bench-slot" data-player="opponent" data-slot="1"></div>
                    <div class="card-slot bench-slot" data-player="opponent" data-slot="2"></div>
                </div>
                <div class="active-area">
                    <div class="card-slot active-slot" data-player="opponent"></div>
                </div>
            </div>
        </div>

        <!-- Player's Board -->
        <div class="board player-board">
            <div class="play-area">
                <div class="active-area">
                    <div class="card-slot active-slot" data-player="player"></div>
                    <div class="attack-buttons">
                        <button id="attack-btn" class="action-btn" style="display: none;">Attack</button>
                        <button id="attack2-btn" class="action-btn" style="display: none;">Attack 2</button>
                    </div>
                    <button id="retreat-btn" class="action-btn retreat-btn" style="display: none;">Retreat</button>
                </div>
                <div class="bench-area">
                    <div class="card-slot bench-slot" data-player="player" data-slot="0"></div>
                    <div class="card-slot bench-slot" data-player="player" data-slot="1"></div>
                    <div class="card-slot bench-slot" data-player="player" data-slot="2"></div>
                </div>
            </div>
            <div class="hand-area">
                <div id="player-hand" class="hand">
                    <!-- Player's hand -->
                </div>
            </div>
        </div>

        <!-- Action Panel -->
        <div id="action-panel">
            <button id="player-discard-btn" class="main-btn discard-btn">Your Discard Pile (0)</button>
            <button id="energy-btn" class="main-btn energy-btn" disabled>Attach Energy</button>
            <button id="done-btn" class="main-btn">Done</button>
            <button id="new-game-btn" class="main-btn" style="display: none;">New Game</button>
            <button id="opponent-discard-btn" class="main-btn discard-btn">Opponent's Discard Pile (0)</button>
        </div>
        </div>
    </div>

    <!-- Card Zoom Overlay -->
    <div id="card-zoom" class="card-zoom" style="display: none;">
        <img id="zoom-image" src="" alt="Card">
    </div>

    <!-- Item Card Flash Overlay -->
    <div id="item-flash" class="item-flash" style="display: none;">
        <div class="flash-content">
            <h3 id="flash-title">Opponent used:</h3>
            <img id="flash-image" src="" alt="Item Card">
        </div>
    </div>

    <!-- Modal for selecting bench creature -->
    <div id="select-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2 id="modal-title">Select a creature</h2>
            <div id="modal-options" class="modal-options"></div>
        </div>
    </div>

    <!-- Discard Pile Modal -->
    <div id="discard-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <button class="modal-close-btn" onclick="closeDiscardModal()">×</button>
            <h2 id="discard-title">Discard Pile</h2>
            <div id="discard-cards" class="discard-cards"></div>
        </div>
    </div>

    <!-- Deck Preview Modal -->
    <div id="deck-preview-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <button class="modal-close-btn" onclick="closeDeckPreview()">×</button>
            <h2 id="deck-preview-title">Deck Preview</h2>
            <div id="deck-preview-cards" class="deck-preview-cards"></div>
            <button id="select-deck-btn" class="main-btn" style="margin-top: 20px;">Select This Deck</button>
        </div>
    </div>

    <!-- Deck Builder Modal -->
    <div id="deck-builder-modal" class="modal" style="display: none;">
        <div class="modal-content deck-builder-content">
            <button class="modal-close-btn" onclick="closeDeckBuilder()">×</button>
            <h2>Create Custom Deck</h2>
            <input type="text" id="custom-deck-name" placeholder="Enter deck name..." style="width: 300px; padding: 8px; margin: 10px 0; font-size: 16px;">
            
            <div class="deck-builder-container">
                <div class="card-pool">
                    <h3>Available Cards</h3>
                    <div id="available-cards" class="builder-cards"></div>
                </div>
                
                <div class="deck-composition">
                    <h3>Your Deck (<span id="deck-card-count">0</span> cards)</h3>
                    <div id="deck-validation" class="validation-message"></div>
                    <div id="custom-deck-cards" class="builder-cards"></div>
                    <button id="save-custom-deck-btn" class="main-btn" style="margin-top: 10px;">Save Deck</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
