<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f0f0f0;
    }
    #gameContainer {
        margin: 20px auto;
        width: 360px;
    }
    #lengthCounter {
        font-size: 20px;
        margin-bottom: 10px;
    }
    #gameMessage {
        font-size: 18px;
        margin-top: 10px;
        color: #e33;
        height: 24px;
    }
    canvas {
        background: #222;
        display: block;
        margin: 0 auto;
        border: 3px solid #555;
    }
    .mobile-controls {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 15px;
        flex-wrap: wrap;
    }
    .arrow-btn {
        width: 60px;
        height: 60px;
        font-size: 24px;
        background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
        color: white;
        border: 2px solid #45a049;
        border-radius: 8px;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        transition: all 0.1s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .arrow-btn:active {
        transform: scale(0.95);
        background: linear-gradient(135deg, #45a049 0%, #4CAF50 100%);
    }
    .arrow-btn:hover {
        background: linear-gradient(135deg, #45a049 0%, #3a8f3e 100%);
        box-shadow: 0 0 15px rgba(76, 175, 80, 0.5);
    }
    .controls-row {
        display: flex;
        justify-content: center;
        gap: 10px;
    }
    #menuOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
        color: white;
    }
    .menu-content {
        background: #333;
        padding: 30px;
        border-radius: 10px;
        text-align: center;
    }
    .menu-content h2 {
        margin-top: 0;
    }
    .menu-content button {
        padding: 10px 20px;
        font-size: 16px;
        margin: 10px;
        cursor: pointer;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
    }
    .menu-content button:hover {
        background: #45a049;
    }
    .hidden {
        display: none !important;
    }
    @media (max-width: 480px) {
        #gameContainer {
            width: 100% !important;
            max-width: 360px;
        }
        canvas {
            max-width: 100%;
            height: auto;
        }
        .arrow-btn {
            width: 70px;
            height: 70px;
            font-size: 28px;
        }
    }
</style>
</head>
<body>

<h2>Snake Game</h2>

<div id="menuOverlay">
    <div class="menu-content">
        <h2>Snake</h2>
        <p>Select Size:</p>
        <button id="btnSmall">Small (15x15)</button>
        <button id="btnBig">Big (18x18)</button>
    </div>
</div>

<div id="gameContainer">
    <div id="lengthCounter">Length: 1</div>
    <canvas id="gameCanvas" width="300" height="300"></canvas>
    <div id="gameMessage"></div>
    
    <!-- Mobile Controls -->
    <div class="mobile-controls">
        <div class="controls-row">
            <button id="btnUp" class="arrow-btn">▲</button>
        </div>
        <div class="controls-row">
            <button id="btnLeft" class="arrow-btn">◀</button>
            <button id="btnDown" class="arrow-btn">▼</button>
            <button id="btnRight" class="arrow-btn">▶</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let gridSize = 20;
let tileCount = 15;
let difficulty = "small";
let canvasSize = 300;

let snake = [{ x: 7, y: 7 }];
let velocity = { x: 0, y: 0 };
let nextVelocity = { x: 0, y: 0 };
let food = { x: 5, y: 5 };
let gameOver = false;
let gameStarted = false;

let speed = 150;

// Translation system
let currentLang = 'en';

// Get language from parent safely
function getParentLanguage() {
    try {
        return window.parent.currentLanguage || 'en';
    } catch (e) {
        return 'en';
    }
}

const translations = {
    en: {
        title: 'Snake Game',
        menuTitle: 'Snake',
        selectSize: 'Select Size:',
        small: 'Small (15x15)',
        big: 'Big (18x18)',
        length: 'Length',
        gameOver: 'Game Over! Final length'
    },
    pt: {
        title: 'Jogo da Cobra',
        menuTitle: 'Cobra',
        selectSize: 'Selecione o Tamanho:',
        small: 'Pequeno (15x15)',
        big: 'Grande (18x18)',
        length: 'Comprimento',
        gameOver: 'Fim do Jogo! Comprimento final'
    }
};

function t(key) {
    return translations[currentLang][key] || key;
}

function updateLanguage() {
    currentLang = getParentLanguage();
    document.querySelector('h2').textContent = t('title');
    document.querySelector('.menu-content h2').textContent = t('menuTitle');
    document.querySelector('.menu-content p').textContent = t('selectSize');
    document.getElementById('btnSmall').textContent = t('small');
    document.getElementById('btnBig').textContent = t('big');
    
    if (!gameOver && gameStarted) {
        document.getElementById("lengthCounter").textContent = t('length') + ': ' + snake.length;
    }
}

// Listen for language changes
window.addEventListener('message', function(event) {
    if (event.data.type === 'languageChange') {
        updateLanguage();
    }
});

// Update language on load and after a short delay to ensure parent is ready
setTimeout(updateLanguage, 100);
updateLanguage();

document.addEventListener("keydown", keyPress);

// Mobile arrow button controls
document.getElementById("btnUp").addEventListener("click", () => {
    if (velocity.y !== 1) nextVelocity = { x: 0, y: -1 };
});

document.getElementById("btnDown").addEventListener("click", () => {
    if (velocity.y !== -1) nextVelocity = { x: 0, y: 1 };
});

document.getElementById("btnLeft").addEventListener("click", () => {
    if (velocity.x !== 1) nextVelocity = { x: -1, y: 0 };
});

document.getElementById("btnRight").addEventListener("click", () => {
    if (velocity.x !== -1) nextVelocity = { x: 1, y: 0 };
});

// Touch events for mobile (prevent default to avoid scrolling)
document.getElementById("btnUp").addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (velocity.y !== 1) nextVelocity = { x: 0, y: -1 };
});

document.getElementById("btnDown").addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (velocity.y !== -1) nextVelocity = { x: 0, y: 1 };
});

document.getElementById("btnLeft").addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (velocity.x !== 1) nextVelocity = { x: -1, y: 0 };
});

document.getElementById("btnRight").addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (velocity.x !== -1) nextVelocity = { x: 1, y: 0 };
});

// Menu buttons
document.getElementById("btnSmall").addEventListener("click", () => {
    startGame("small");
});

document.getElementById("btnBig").addEventListener("click", () => {
    startGame("big");
});

function startGame(mode) {
    difficulty = mode;
    
    if (mode === "small") {
        tileCount = 15;
        canvasSize = 300;
    } else {
        tileCount = 18;
        canvasSize = 360;
    }
    
    gridSize = canvasSize / tileCount;
    canvas.width = canvasSize;
    canvas.height = canvasSize;
    document.getElementById("gameContainer").style.width = canvasSize + "px";
    
    // Hide menu
    document.getElementById("menuOverlay").classList.add("hidden");
    
    // Reset game
    snake = [{ x: Math.floor(tileCount / 2), y: Math.floor(tileCount / 2) }];
    velocity = { x: 0, y: 0 };
    nextVelocity = { x: 0, y: 0 };
    gameOver = false;
    gameStarted = true;
    speed = 150;
    
    spawnFood();
    document.getElementById("lengthCounter").textContent = t('length') + ': 1';
    document.getElementById("gameMessage").textContent = "";
    
    gameLoop();
}

function keyPress(e) {
    if (e.key === "ArrowUp" && velocity.y !== 1) nextVelocity = { x: 0, y: -1 };
    if (e.key === "ArrowDown" && velocity.y !== -1) nextVelocity = { x: 0, y: 1 };
    if (e.key === "ArrowLeft" && velocity.x !== 1) nextVelocity = { x: -1, y: 0 };
    if (e.key === "ArrowRight" && velocity.x !== -1) nextVelocity = { x: 1, y: 0 };
}

function gameLoop() {
    if (gameOver) return;

    update();
    draw();

    setTimeout(gameLoop, speed);
}

function update() {
    if (velocity.x === 0 && velocity.y === 0) {
        velocity = nextVelocity;
        return;
    }

    velocity = nextVelocity;

    const head = {
        x: snake[0].x + velocity.x,
        y: snake[0].y + velocity.y
    };

    head.x = (head.x + tileCount) % tileCount;
    head.y = (head.y + tileCount) % tileCount;

    for (let part of snake) {
        if (part.x === head.x && part.y === head.y) {
            endGame();
            return;
        }
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
        spawnFood();
        speed = Math.max(40, speed - 5);
    } else {
        snake.pop();
    }

    document.getElementById("lengthCounter").textContent =
        t('length') + ': ' + snake.length;
}

function spawnFood() {
    food.x = Math.floor(Math.random() * tileCount);
    food.y = Math.floor(Math.random() * tileCount);
}

function draw() {
    ctx.fillStyle = "#222";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw snake body
    ctx.fillStyle = "#4CAF50";
    snake.forEach((part, index) => {
        ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);

        // Draw eye on the head only
        if (index === 0) {
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(
                part.x * gridSize + gridSize * 0.7,
                part.y * gridSize + gridSize * 0.3,
                3,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.fillStyle = "#4CAF50";
        }
    });

    // Draw food
    ctx.fillStyle = "red";
    ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
}

function endGame() {
    gameOver = true;
    document.getElementById("gameMessage").textContent =
        t('gameOver') + ': ' + snake.length;
    
    // Save score to leaderboard
    if (window.parent && window.parent.saveGameScore) {
        window.parent.saveGameScore("Snake", {
            length: snake.length,
            difficulty: difficulty
        }).then((result) => {
            console.log("Snake score saved successfully");
            if (result && result.isNewBest && window.parent.showNewBestScore) {
                window.parent.showNewBestScore("Snake", { length: snake.length, difficulty: difficulty });
            }
        }).catch(err => {
            console.error("Error saving Snake score:", err);
        });
    } else {
        console.error("saveGameScore function not found in parent window");
    }
}

// Show menu on startup
document.getElementById("menuOverlay").classList.remove("hidden");
</script>

</body>
</html>
