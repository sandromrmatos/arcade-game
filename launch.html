<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Start Game</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      padding-top: 60px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      margin: 0;
    }
    .left-banner {
      position: fixed;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
    }
    .right-banner {
      position: fixed;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
    }
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 800px;
    }
    button {
      padding: 14px 24px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: linear-gradient(135deg, #9effb0 0%, #c7ffd9 100%);
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    h2 {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <!-- Left Side Banner -->
  <div class="left-banner">
    <script>
      atOptions = {
        'key' : '7ba91ff59f9a86aa46a4d8f12ad4f332',
        'format' : 'iframe',
        'height' : 600,
        'width' : 160,
        'params' : {}
      };
    </script>
    <script src="https://www.highperformanceformat.com/7ba91ff59f9a86aa46a4d8f12ad4f332/invoke.js"></script>
  </div>

  <!-- Right Side Banner -->
  <div class="right-banner">
    <script>
      atOptions = {
        'key' : 'a1302af715e120d80d966a3d28a8a88e',
        'format' : 'iframe',
        'height' : 300,
        'width' : 160,
        'params' : {}
      };
    </script>
    <script src="https://www.highperformanceformat.com/a1302af715e120d80d966a3d28a8a88e/invoke.js"></script>
  </div>

  <div class="main-content">
    <h2 id="game-title">Game</h2>
    <button id="start-btn">Start Playing</button>

    <!-- Adsterra Banner -->
    <div style="margin: 200px auto 30px; text-align: center; display: block; clear: both;">
      <script>
        atOptions = {
          'key' : '08eabecb95d5f48211d73ad53108132b',
          'format' : 'iframe',
          'height' : 90,
          'width' : 728,
          'params' : {}
        };
      </script>
      <script src="https://www.highperformanceformat.com/08eabecb95d5f48211d73ad53108132b/invoke.js"></script>
    </div>

    <!-- Native Banner -->
    <div style="margin: 30px auto; text-align: center; display: block; clear: both;">
      <script>
        atOptions = {
          'key' : '351110f0be13f404c65ab8b04d78fb77',
          'format' : 'iframe',
          'height' : 250,
          'width' : 300,
          'params' : {}
        };
      </script>
      <script src="https://www.highperformanceformat.com/351110f0be13f404c65ab8b04d78fb77/invoke.js"></script>
    </div>
  </div>

  <script>
    // Read game name from URL
    const params = new URLSearchParams(window.location.search);
    const game = params.get("game");

    document.getElementById("game-title").textContent = game;

    document.getElementById("start-btn").onclick = () => {
      window.location.href = `${game}/index.html`;
    };
  </script>

</body>
</html>
